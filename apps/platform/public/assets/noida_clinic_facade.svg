<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#skyGrad)" />

  <!-- Ground / Pavement -->
  <rect y="310" width="600" height="90" fill="#E2E8F0" />
  <line x1="0" y1="310" x2="600" y2="310" stroke="#CBD5E1" stroke-width="4" />

  <!-- Clinic Building -->
  <rect x="70" y="70" width="460" height="240" rx="10" fill="url(#buildingGrad)" stroke="#CBD5E1" stroke-width="2" />

  <!-- Modern Top Fascia / Brand Board -->
  <rect x="90" y="86" width="420" height="64" rx="8" fill="#0F766E" />
  <!-- Medical Cross on Signboard -->
  <g fill="#FFFFFF">
    <rect x="114" y="104" width="28" height="8" rx="2" />
    <rect x="124" y="94" width="8" height="28" rx="2" />
  </g>
  <text x="156" y="118" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="800">
    HealthConsult Family Clinic
  </text>
  <text x="156" y="136" fill="#99F6E4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600">
    Plot 14, Health Plaza, Sector 18, Noida • Dr. Maanvita Kumari
  </text>

  <!-- Ground Floor Glass Entrance -->
  <rect x="230" y="180" width="140" height="130" rx="4" fill="url(#glassGrad)" stroke="#0F766E" stroke-width="3" opacity="0.9" />
  <line x1="300" y1="180" x2="300" y2="310" stroke="#0F766E" stroke-width="2" />
  <!-- Door Handles -->
  <line x1="294" y1="235" x2="294" y2="265" stroke="#0F766E" stroke-width="4" stroke-linecap="round" />
  <line x1="306" y1="235" x2="306" y2="265" stroke="#0F766E" stroke-width="4" stroke-linecap="round" />

  <!-- Windows Left -->
  <rect x="110" y="180" width="90" height="100" rx="6" fill="url(#glassGrad)" stroke="#94A3B8" stroke-width="2" />
  <line x1="155" y1="180" x2="155" y2="280" stroke="#94A3B8" stroke-width="1.5" />
  <line x1="110" y1="230" x2="200" y2="230" stroke="#94A3B8" stroke-width="1.5" />

  <!-- Windows Right -->
  <rect x="400" y="180" width="90" height="100" rx="6" fill="url(#glassGrad)" stroke="#94A3B8" stroke-width="2" />
  <line x1="445" y1="180" x2="445" y2="280" stroke="#94A3B8" stroke-width="1.5" />
  <line x1="400" y1="230" x2="490" y2="230" stroke="#94A3B8" stroke-width="1.5" />

  <!-- Decorative Greenery Pots -->
  <rect x="202" y="275" width="22" height="35" rx="3" fill="#B45309" />
  <ellipse cx="213" cy="265" rx="18" ry="20" fill="#15803D" />

  <rect x="376" y="275" width="22" height="35" rx="3" fill="#B45309" />
  <ellipse cx="387" cy="265" rx="18" ry="20" fill="#15803D" />

  <!-- Accreditation Pill -->
  <g transform="translate(200, 335)">
    <rect width="200" height="30" rx="15" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5" />
    <circle cx="20" cy="15" r="7" fill="#16A34A" />
    <text x="36" y="19" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
      NABH Certified Family Clinic
    </text>
  </g>
</svg>