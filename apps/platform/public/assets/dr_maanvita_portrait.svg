<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="50%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGrad)" />

  <!-- Subtle Clinical Cross Motif in Background -->
  <g opacity="0.08" fill="#0F766E">
    <rect x="290" y="40" width="80" height="24" rx="6" />
    <rect x="318" y="12" width="24" height="80" rx="6" />
    <rect x="40" y="220" width="60" height="18" rx="4" />
    <rect x="61" y="199" width="18" height="60" rx="4" />
  </g>

  <!-- Hair Back -->
  <path d="M 120 180 C 110 260, 100 320, 130 360 C 150 370, 170 370, 180 340 L 220 340 C 230 370, 250 370, 270 360 C 300 320, 290 260, 280 180 Z" fill="url(#hairGrad)" />

  <!-- Shoulders / Scrub Inner Top -->
  <path d="M 110 390 L 290 390 L 280 330 L 120 330 Z" fill="#0D9488" />

  <!-- White Lab Coat Body -->
  <path d="M 60 480 L 110 320 L 160 330 L 200 400 L 240 330 L 290 320 L 340 480 Z" fill="url(#coatGrad)" filter="url(#softShadow)" />

  <!-- Coat Lapels -->
  <path d="M 110 320 L 170 430 L 200 400 L 160 330 Z" fill="#E2E8F0" />
  <path d="M 290 320 L 230 430 L 200 400 L 240 330 Z" fill="#E2E8F0" />
  <path d="M 170 430 L 200 480 L 230 430 L 200 400 Z" fill="#FFFFFF" />

  <!-- Doctor Neck -->
  <path d="M 170 250 L 230 250 L 235 320 L 165 320 Z" fill="#FBBF24" />
  <path d="M 180 290 C 200 305, 200 305, 220 290 Z" fill="#F59E0B" opacity="0.4" />

  <!-- Face -->
  <ellipse cx="200" cy="210" rx="65" ry="75" fill="#FDE68A" />

  <!-- Cheeks Blush -->
  <circle cx="155" cy="225" r="14" fill="#F87171" opacity="0.18" />
  <circle cx="245" cy="225" r="14" fill="#F87171" opacity="0.18" />

  <!-- Hair Front Style -->
  <path d="M 135 190 C 130 110, 270 110, 265 190 C 255 140, 225 130, 200 135 C 175 130, 145 140, 135 190 Z" fill="url(#hairGrad)" />
  <path d="M 135 190 C 145 160, 175 160, 190 170 C 170 180, 150 185, 135 190 Z" fill="#0F172A" />
  <path d="M 265 190 C 255 160, 225 160, 210 170 C 230 180, 250 185, 265 190 Z" fill="#0F172A" />

  <!-- Eyes & Eyebrows -->
  <ellipse cx="170" cy="200" rx="7" ry="5" fill="#0F172A" />
  <circle cx="172" cy="198" r="2" fill="#FFFFFF" />
  <path d="M 158 190 Q 170 184 182 188" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />

  <ellipse cx="230" cy="200" rx="7" ry="5" fill="#0F172A" />
  <circle cx="232" cy="198" r="2" fill="#FFFFFF" />
  <path d="M 218 188 Q 230 184 242 190" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 200 198 L 196 220 L 204 220" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Warm Compassionate Smile -->
  <path d="M 184 240 Q 200 254 216 240" stroke="#BE123C" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 186 240 Q 200 248 214 240 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Stethoscope around Neck -->
  <path d="M 160 320 C 150 380, 160 420, 180 430 C 190 435, 200 425, 200 410" stroke="#334155" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 240 320 C 250 380, 240 430, 215 445 L 210 460" stroke="#334155" stroke-width="7" stroke-linecap="round" fill="none" />
  <!-- Stethoscope Bell/Chestpiece -->
  <circle cx="210" cy="465" r="14" fill="#94A3B8" stroke="#475569" stroke-width="3" />
  <circle cx="210" cy="465" r="8" fill="#CBD5E1" />

  <!-- Name Badge on Coat Pocket -->
  <rect x="250" y="380" width="60" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="254" y="384" width="16" height="18" rx="2" fill="#0F766E" />
  <line x1="274" y1="389" x2="304" y2="389" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
  <line x1="274" y1="395" x2="296" y2="395" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Lower Overlay Tag -->
  <g transform="translate(60, 430)">
    <rect width="280" height="40" rx="10" fill="#0F172A" opacity="0.88" />
    <text x="140" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      Dr. Maanvita Kumari • MBBS, MD
    </text>
  </g>
</svg>
